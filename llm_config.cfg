; Committed LLM reasoner configuration (sprint 3 scaffolding §5, ADR-5).
;
; Endpoint and model ONLY. The API key is NEVER put in this file — it comes from the
; DELVE_LLM_API_KEY environment variable or from user://llm_secrets.cfg, both outside the
; repository. Environment variables (DELVE_LLM_ENDPOINT, DELVE_LLM_MODEL) override these
; values for a single session without editing a tracked file.
;
; Both values empty means: no remote reasoner, run the shipped heuristic provider. That is the
; CI configuration and the default play configuration, per the amended ADR-5.
[llm]
endpoint=""
model=""
